[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "brake-demo"
dynamic = ["version"]
description = "Tiny ABS logic used to demo test automation and CI/CD with GitHub Actions"
readme = "README.md"
requires-python = ">=3.10"

[project.optional-dependencies]
test = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[project.scripts]
brake-demo = "brake_demo.__main__:main"

[tool.setuptools.dynamic]
version = { attr = "brake_demo.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
